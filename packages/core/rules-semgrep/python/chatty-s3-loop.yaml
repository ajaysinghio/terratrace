rules:
  - id: chatty-s3-loop
    languages: [python]
    severity: WARNING
    message: >-
      This loop issues a separate S3 API call on every iteration instead of batching. Each
      call is its own billed request plus network round-trip; prefer a batch/bulk API
      (e.g. `list_objects_v2` with pagination done once outside the loop, or
      `download_fileobj`/`upload_fileobj` concurrency) over calling S3 once per item.
    metadata:
      category: performance
      terratrace-lens: storage
      terratrace-severity: medium
    patterns:
      - pattern-either:
          - pattern: |
              for $VAR in $COLL:
                  ...
                  $S3.get_object(...)
                  ...
          - pattern: |
              for $VAR in $COLL:
                  ...
                  $S3.put_object(...)
                  ...
          - pattern: |
              for $VAR in $COLL:
                  ...
                  $S3.list_objects(...)
                  ...
          - pattern: |
              for $VAR in $COLL:
                  ...
                  $S3.list_objects_v2(...)
                  ...
          - pattern: |
              for $VAR in $COLL:
                  ...
                  $S3.head_object(...)
                  ...
