name: "TerraTrace"
description: "On pull_request events, comments carbon/cost findings on the PR. On push/schedule/workflow_dispatch, scans the whole repo and opens validated fix PRs against the default branch (idempotent per finding)."
inputs:
  github-token:
    description: "Token used for PR reads/writes and (in the fix-PR flow) branch creation and content updates. Needs contents:write and pull-requests:write permissions on the caller workflow."
    required: true
  anthropic-api-key:
    description: "Anthropic API key used to generate explanations and fix diffs. Supply this OR openrouter-api-key — at least one is required."
    required: false
  openrouter-api-key:
    description: "OpenRouter API key (routes Claude calls through OpenRouter's OpenAI-compatible endpoint). Supply this OR anthropic-api-key — at least one is required."
    required: false
runs:
  using: "node24"
  main: "dist/index.js"
