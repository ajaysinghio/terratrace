name: TerraTrace (fix PRs)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Uncomment to also run on a schedule:
  # schedule:
  #   - cron: "0 6 * * 1"   # Monday 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the Action's bundle fresh from src on every run. Adds ~1–2 min
      # but eliminates the "committed dist is stale" trap — CI always runs
      # exactly what's in src/. If PoC iteration slows down, swap to the
      # committed-dist pattern (drop these three steps, keep only the
      # `uses: ./packages/github-action` step, and rebuild+commit dist
      # before pushing).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.22.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Semgrep is a Python package; install it before the Action step so
      # SemgrepAnalyzer's subprocess call resolves. Detection depends on
      # this — the Action fails loud if semgrep is missing.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install semgrep

      - name: Run TerraTrace
        uses: ./packages/github-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Set exactly one of these. The Action fails if neither is set.
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
