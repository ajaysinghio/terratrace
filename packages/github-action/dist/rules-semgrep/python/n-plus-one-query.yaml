rules:
  - id: n-plus-one-query
    languages: [python]
    severity: WARNING
    message: >-
      This loop appears to issue a database call on every iteration (N+1 query pattern).
      Each iteration adds its own round-trip cost and carbon overhead; batch it into a single
      query (e.g. Django's prefetch_related/select_related, or an equivalent bulk fetch/IN query)
      before the loop instead.
    metadata:
      category: performance
      terratrace-lens: database
      terratrace-severity: high
    patterns:
      # Match the ENTIRE for-loop (not just the inner .filter/.get call) so
      # the finding's snippet gives the LLM enough surrounding context to
      # author a fix. Matching only the call leaves the LLM guessing at the
      # loop structure it needs to rewrite, which is why diffs kept failing
      # to apply — context lines didn't line up with the real source.
      - pattern-either:
          - pattern: |
              for $VAR in $COLL:
                  ...
                  $M.objects.filter(...)
                  ...
          - pattern: |
              for $VAR in $COLL:
                  ...
                  $M.objects.get(...)
                  ...
          - pattern: |
              for $VAR in $COLL:
                  ...
                  $M.query(...)
                  ...
